services:
  db:
    image: postgres:15-alpine
    container_name: verdicto-db
    environment:
      POSTGRES_USER: verdicto
      POSTGRES_PASSWORD: verdicto_secret
      POSTGRES_DB: verdicto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdicto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verdicto-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verdicto-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://verdicto:verdicto_secret@db:5432/verdicto
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verdicto-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://verdicto:verdicto_secret@db:5432/verdicto
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.worker worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
